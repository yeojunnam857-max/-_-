<!DOCTYPE html>

<head>

  :root{--ink:#0F1524;--paper:#F3EFE4;--line:#8A96A8}
  :root:not([data-theme="light"]){}

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1280,H=720,GROUND=600;
const P1C='#F0503C',P2C='#3F8CF2',GOLD='#FFD23F',PAPER='#F3EFE4';

/* ---------- 입력 ---------- */
const keys={},pressed={};
const P1K={up:'KeyW',left:'KeyA',down:'KeyS',right:'KeyD',atk:'Space',s1:'KeyG',s2:'KeyH',s3:'KeyJ'};
const P2K={up:'ArrowUp',left:'ArrowLeft',down:'ArrowDown',right:'ArrowRight',atk:'Enter',s1:'Numpad4',s2:'Numpad5',s3:'Numpad6'};
window.addEventListener('keydown',e=>{
  if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;
  if(e.code.startsWith('Arrow')||e.code.startsWith('Numpad')||e.code==='Space'||e.code==='Enter')e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
const down=c=>!!keys[c],hit=c=>{const v=!!pressed[c];pressed[c]=false;return v;};

/* ---------- 캐릭터 정의 ----------
 type: melee | dash | rush | proj | spread | backshot | grenade | shotgun | rain | burst | beam
 fx  : 이펙트 종류 (slash, punch, arrow, bullet, blast, beam, boom)
*/
const CHARS=[
 {id:'hwang',name:'황시논',desc:'뺨, 얼음, 나비, 그리고 물리',color:'#7FD8FF',glow:'#2E8BFF',hp:110,
  basic:{name:'뺨때리기',cd:40,type:'melee',start:11,active:5,total:19,range:66,h:50,dmg:6,kb:6,fx:'slap'},
  skills:[
   {name:'시원',cd:330,type:'freeze',start:6,active:8,total:16,range:130,h:90,dmg:6,freeze:60,fx:'ice'},

 {id:'kim',name:'김찬희',desc:'표식, 냉방, 그리고 BGM',color:'#4FE3C1',glow:'#00C9A7',hp:100,

 {name:'샥',start:6,active:5,total:18,range:70,h:115,yoff:10,dmg:5,kb:4},

const ARROWS=['up','right','down','left'];
const UPOKE={name:'어퍼지건',cd:0,type:'upoke',start:4,active:6,total:22,range:74,h:95,yoff:95,dmg:6,kb:5,fx:'upoke'};
/* 5x5 픽셀 폰트 */
const PIX={A:[14,17,31,17,17],B:[30,17,30,17,30],C:[15,16,16,16,15],D:[30,17,17,17,30],E:[31,16,30,16,31],F:[31,16,30,16,16],G:[15,16,19,17,15],H:[17,17,31,17,17],I:[31,4,4,4,31],J:[7,2,2,18,12],K:[17,18,28,18,17],L:[16,16,16,16,31],M:[17,27,21,17,17],N:[17,25,21,19,17],O:[14,17,17,17,14],P:[30,17,30,16,16],Q:[14,17,21,18,13],R:[30,17,30,18,17],S:[15,16,14,1,30],T:[31,4,4,4,4],U:[17,17,17,17,14],V:[17,17,17,10,4],W:[17,17,21,27,17],X:[17,10,4,10,17],Y:[17,10,4,4,4],Z:[31,2,4,8,31],'!':[4,4,4,0,4],'?':[14,17,2,0,4]};
function drawPix(str,x,y,px,col,align='center'){
  const w=str.length*6*px-px;let sx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.fillStyle=col;
  for(const ch of str){const g=PIX[ch];if(g){for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(g[r]>>(4-c)&1)ctx.fillRect(sx+c*px,y-2.5*px+r*px,px,px);}sx+=6*px;}
}
/* ---------- 상태 ---------- */
let scene='menu',menuIdx=0,t=0,hitstop=0,flash=0,holdInput=false;
const match={round:1,wins:[0,0],first:0,pick:[null,null],picker:0,cursor:[0,0],phase:0,vsTimer:0};
let fighters=[],projs=[],particles=[],fx=[],ghosts=[],springs=[],wires=[],boxes=[],tris=[],npcs=[],mirrorT=0,ts=null,timer=0,roundMsg='',msgTimer=0,shake=0;

function newMatch(){match.round=1;match.wins=[0,0];match.first=0;startSelect();}
function startSelect(){match.pick=[null,null];match.picker=match.first;match.phase=0;match.cursor=[0,0];scene='select';}
function makeFighter(i,ci){const c=CHARS[ci];return{i,c,x:i===0?320:W-320,y:GROUND,vx:0,vy:0,face:i===0?1:-1,hp:c.hp,maxhp:c.hp,onGround:true,block:false,stun:0,atk:null,cds:[0,0,0],cdb:0,hurtFlash:0,dead:false,hb:null,frozen:0,slow:0,flying:false,physIdx:0,fear:0,counter:0,letterIdx:0,tapDir:0,tapT:-99,dash:0,dashDir:0,dashCd:0,shieldT:0,shieldCd:0,marks:0,cold:0,bleed:0,bgm:0,nextAtk:null,gHp:100,gBreak:0,chalk:0,chalkIdx:0,beast:0};}
function startFight(){fighters=[makeFighter(0,match.pick[0]),makeFighter(1,match.pick[1])];projs=[];particles=[];fx=[];ghosts=[];springs=[];wires=[];boxes=[];tris=[];npcs=[];mirrorT=0;ts=null;timer=60*60;roundMsg=`ROUND ${match.round}`;msgTimer=90;scene='fight';}

/* ---------- 이펙트 ---------- */
function addFx(o){o.t=0;fx.push(o);}
function sparks(x,y,n,col,pow=8,dir=0){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;const s=Math.random()*pow+2;particles.push({x,y,vx:Math.cos(a)*s+dir*3,vy:Math.sin(a)*s-2,life:14+Math.random()*16,c:col,z:0.5+Math.random()});}}
function impact(x,y,col,big){
  addFx({k:'ring',x,y,col,life:big?22:14,r0:10,r1:big?150:80});
  addFx({k:'rays',x,y,col,life:big?14:9,n:big?14:8,len:big?150:80});
  addFx({k:'flash',x,y,col,life:6,r:big?90:50});
  sparks(x,y,big?18:8,col,big?14:8);streaks(x,y,big?12:5,col,big?16:9,0);
  if(big)addFx({k:'shock',x,y:GROUND,col,life:24,r1:220});
}
function weaponFx(f,sk){
  const ox=f.x+f.face*36,oy=f.y-66,c=f.c.color,g=f.c.glow,d=f.face,seed=(f.x*7+t*13)|0;
  switch(sk.fx){
    case 'chalk':{const v=f.atk&&f.atk.sk.name;const cc='#F2F2EA',gg='#9FA8B8';
      if(v==='샥')addFx({k:'ribbon',x:f.x+d*18,y:f.y-66,dir:d,rx:70,ry:98,rot:0,a0:-1.5,a1:1.45,wmax:14,col:cc,glow:gg,life:12,seed});
      else if(v==='슥')addFx({k:'ribbon',x:f.x+d*10,y:f.y-62,dir:d,rx:110,ry:30,rot:0,a0:3.5,a1:6.5,wmax:12,col:cc,glow:gg,life:12,seed});
      else addFx({k:'beam',x:f.x+d*16,y:f.y-58,dir:d,col:cc,glow:gg,life:10,len:130});
      chalkDust(f.x+d*50,f.y-60,5);break;}
    case 'chalkemp':break;
    case 'nacho':case 'master':case 'beast':chalkDust(ox,oy,6);break;
    case 'poke':addFx({k:'finger',x:f.x+d*8,y:f.y-60,dir:d,col:c,glow:g,life:14,sc:0.68});streaks(f.x+d*60,f.y-71,4,c,7,d);break;
    case 'upoke':addFx({k:'finger',x:f.x+d*6,y:f.y-70,dir:d,col:c,glow:g,life:18,sc:0.85,up:true});addFx({k:'shock',x:f.x,y:GROUND,col:c,life:14,r1:110});break;
    case 'cold':addFx({k:'flash',x:ox,y:oy,col:'#BFF2FF',life:6,r:40});break;
    case 'pierce':addFx({k:'shock',x:f.x,y:GROUND,col:c,life:16,r1:120});break;
    case 'bgm':addFx({k:'ptext',x:f.x,y:f.y-118,dir:d,text:'BGM',px:6,col:'#FF7ACB',glow:'#FF2D8A',life:28,rise:true});break;
    case 'letter':addFx({k:'flash',x:ox,y:oy-4,col:c,life:4,r:16});break;
    case 'siren':addFx({k:'siren',x:ox-d*10,y:oy-6,col:c,glow:g,life:34});addFx({k:'flash',x:ox-d*10,y:oy-6,col:'#FFFFFF',life:6,r:60});break;
    case 'no':addFx({k:'flash',x:ox,y:oy,col:c,life:6,r:36});break;
    case 'ok':addFx({k:'ring',x:f.x,y:oy,col:'#FFE45C',life:14,r0:20,r1:90});break;
    case 'slap':addFx({k:'ribbon',x:f.x+d*12,y:f.y-68,dir:d,rx:82,ry:46,rot:-0.5,a0:3.8,a1:6.5,wmax:14,col:'#FFB347',glow:'#FF6A00',life:11,seed});break;
    case 'ice':addFx({k:'ice',x:f.x+d*20,y:f.y,dir:d,col:'#BFF2FF',glow:'#4FC3FF',life:30,n:7,step:20});addFx({k:'flash',x:ox,y:oy,col:'#BFF2FF',life:6,r:30});sparks(ox+d*30,oy,8,'#DFF8FF',6);break;
    case 'bfly':addFx({k:'flash',x:ox,y:oy,col:'#FF9AE1',life:8,r:40});break;
    case 'phys':addFx({k:'flash',x:ox,y:oy,col:c,life:8,r:50});break;
    case 'slash':addFx({k:'ribbon',x:f.x,y:oy,dir:d,rx:190,ry:95,rot:-0.28,a0:3.4,a1:7.1,wmax:26,col:c,glow:g,life:22,seed});break;
    case 'spin':addFx({k:'ribbon',x:f.x,y:oy+10,dir:d,rx:250,ry:85,rot:0.1,a0:2.6,a1:2.6+Math.PI*2.3,wmax:30,col:c,glow:g,life:30,seed});addFx({k:'shock',x:f.x,y:GROUND,col:c,life:20,r1:220});break;
    case 'thrust':addFx({k:'beam',x:ox-d*30,y:oy,dir:d,col:c,glow:g,life:16,len:260});addFx({k:'ribbon',x:f.x-d*30,y:oy,dir:d,rx:120,ry:60,rot:-0.2,a0:4.2,a1:6.9,wmax:12,col:c,glow:g,life:16,seed});break;
    case 'punch':addFx({k:'ribbon',x:f.x+d*20,y:oy,dir:d,rx:95,ry:55,rot:-0.35,a0:3.6,a1:6.6,wmax:18,col:c,glow:g,life:14,seed});addFx({k:'beam',x:ox,y:oy,dir:d,col:c,glow:g,life:9,len:130,thin:true});break;
    case 'upper':addFx({k:'ribbon',x:f.x+d*20,y:oy-20,dir:d,rx:150,ry:75,rot:-1.35,a0:0.4,a1:3.9,wmax:24,col:c,glow:g,life:20,seed});addFx({k:'shock',x:f.x,y:GROUND,col:c,life:18,r1:150});break;
    case 'blast':addFx({k:'cone',x:ox,y:oy,dir:d,col:c,glow:g,life:12,len:180,spread:0.42});addFx({k:'ribbon',x:ox,y:oy,dir:d,rx:110,ry:50,rot:0,a0:4.9,a1:7.7,wmax:10,col:c,glow:g,life:12,seed});addFx({k:'flash',x:ox,y:oy,col:'#FFFFFF',life:5,r:40});streaks(ox,oy,10,c,12,d);break;
    case 'arrow':case 'bullet':case 'beam':case 'boom':addFx({k:'flash',x:ox,y:oy,col:c,life:5,r:sk.fx==='beam'?50:22});if(sk.fx==='beam')addFx({k:'ribbon',x:f.x,y:oy,dir:d,rx:170,ry:80,rot:-0.3,a0:3.5,a1:7.0,wmax:22,col:c,glow:g,life:18,seed});break;
  }
}
function chalkDust(x,y,n){for(let i=0;i<n;i++)particles.push({x:x+(Math.random()-0.5)*30,y:y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:20+Math.random()*20,c:Math.random()<0.7?'#F2F2EA':'#FFE45C',z:0.5+Math.random()*0.5,dust:true});}
function streaks(x,y,n,col,pow=10,dir=0){for(let i=0;i<n;i++){const a=(Math.random()-0.5)*1.6+(dir>0?0:Math.PI);const s=Math.random()*pow+4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:12+Math.random()*14,c:col,z:1,line:true});}}
function ribbonPts(e){
  // 원근이 들어간 타원 궤적 위의 점들
  if(e._pts)return e._pts;const N=26,pts=[];
  for(let i=0;i<=N;i++){const s=i/N,ang=e.a0+(e.a1-e.a0)*s;
    const px=Math.cos(ang)*e.rx,py=Math.sin(ang)*e.ry;
    const cr=Math.cos(e.rot),sr=Math.sin(e.rot);
    pts.push({x:px*cr-py*sr,y:px*sr+py*cr,s});}
  e._pts=pts;return pts;
}
function drawRibbon(e,p){
  const pts=ribbonPts(e);
  const head=Math.min(1,p*1.7),tail=Math.max(0,(p-0.3)/0.7);
  if(tail>=head)return;
  const inv=1-Math.max(0,(p-0.6)/0.4);
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.dir,1);
  const prof=s=>Math.pow(Math.sin(s*Math.PI),0.7);
  const outer=[],inner=[];
  for(let i=0;i<pts.length;i++){
    const q=pts[i];if(q.s<tail||q.s>head)continue;
    const nx=pts[Math.min(i+1,pts.length-1)],pv=pts[Math.max(i-1,0)];
    let tx=nx.x-pv.x,ty=nx.y-pv.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    const w=e.wmax*prof(q.s)*(1-Math.max(0,(q.s-head+0.15)/0.15));
    outer.push({x:q.x-ty*w,y:q.y+tx*w,s:q.s});inner.push({x:q.x+ty*w*0.35,y:q.y-tx*w*0.35,s:q.s});
  }
  if(outer.length<2){ctx.restore();return;}
  const path=()=>{ctx.beginPath();ctx.moveTo(outer[0].x,outer[0].y);for(const o of outer)ctx.lineTo(o.x,o.y);for(let i=inner.length-1;i>=0;i--)ctx.lineTo(inner[i].x,inner[i].y);ctx.closePath();};
  // 1) 넓은 글로우
  ctx.globalAlpha=0.3*inv;ctx.fillStyle=e.glow;path();ctx.fill();
  // 2) 본체
  ctx.globalAlpha=0.85*inv;ctx.fillStyle=e.col;path();ctx.fill();
  // 3) 바깥 가장자리 밝은 선
  ctx.globalAlpha=inv;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(outer[0].x,outer[0].y);for(const o of outer)ctx.lineTo(o.x,o.y);ctx.stroke();
  ctx.globalAlpha=0.6*inv;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(inner[0].x,inner[0].y);for(const o of inner)ctx.lineTo(o.x,o.y);ctx.stroke();
  // 4) 띠 안쪽 소용돌이 무늬
  ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.6;
  const n=10;
  for(let k=0;k<n;k++){
    const s=(k+0.5)/n+((e.seed*(k+1))%7)/70;if(s<tail||s>head-0.05)continue;
    const idx=Math.round(s*(pts.length-1));const q=pts[idx];
    const nx=pts[Math.min(idx+1,pts.length-1)],pv=pts[Math.max(idx-1,0)];let tx=nx.x-pv.x,ty=nx.y-pv.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    const w=e.wmax*prof(s);const cx=q.x-ty*w*0.35,cy=q.y+tx*w*0.35;const r=Math.max(2,w*0.42);
    const dir=k%2?1:-1;ctx.globalAlpha=0.75*inv;ctx.beginPath();
    for(let j=0;j<=14;j++){const th=j/14*Math.PI*1.7*dir+p*2;const rr=r*(1-j/16);ctx.lineTo(cx+Math.cos(th)*rr,cy+Math.sin(th)*rr);}
    ctx.stroke();
    // 작은 방울
    ctx.globalAlpha=0.5*inv;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(q.x-ty*w*0.9,q.y+tx*w*0.9,1.6,0,Math.PI*2);ctx.fill();
  }
  // 5) 머리끝 번쩍임
  if(head<1){const q=pts[Math.round(head*(pts.length-1))];ctx.globalAlpha=0.5*inv;ctx.fillStyle=e.glow;ctx.beginPath();ctx.arc(q.x,q.y,e.wmax*1.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=inv;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(q.x,q.y,e.wmax*0.6,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
function drawFx(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of fx){
    const p=e.t/e.life,inv=1-p;
    if(e.k==='ribbon'){drawRibbon(e,p);}
    else if(e.k==='siren'){

  // 분필 삼각형 / 직선
  for(const tr of tris){
    ctx.globalCompositeOperation='source-over';
    if(tr.kind==='tri'){
      const prog=Math.min(1,tr.t/tr.draw),fade=tr.t>tr.draw?1-(tr.t-tr.draw)/18:1;
      const edges=[[tr.v[0],tr.v[1]],[tr.v[1],tr.v[2]],[tr.v[2],tr.v[0]]];
      for(const [off,al,lw] of [[2.2,0.35,6],[0,0.95,3.2],[-1.4,0.5,1.4]]){ctx.globalAlpha=al*fade;ctx.strokeStyle='#FFE45C';ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();
        let rem=prog*3;for(const [A,B] of edges){if(rem<=0)break;const q=Math.min(1,rem);ctx.moveTo(A.x+off,A.y+off*0.6);ctx.lineTo(A.x+(B.x-A.x)*q+off,A.y+(B.y-A.y)*q+off*0.6);rem-=1;}ctx.stroke();}
      if(tr.t>=tr.draw){ctx.globalAlpha=0.35*fade;ctx.fillStyle=tr.hit?'#FFE45C':'#8A8A60';ctx.beginPath();ctx.moveTo(tr.v[0].x,tr.v[0].y);ctx.lineTo(tr.v[1].x,tr.v[1].y);ctx.lineTo(tr.v[2].x,tr.v[2].y);ctx.closePath();ctx.fill();}
    }else{
      const prog=Math.min(1,tr.t/tr.draw),x1=W*prog;
      if(tr.t<tr.boom){for(const [off,al,lw] of [[2,0.35,7],[0,0.95,3.2],[-1.2,0.5,1.2]]){ctx.globalAlpha=al;ctx.strokeStyle='#FFE45C';ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(0,tr.y+off);ctx.lineTo(x1,tr.y+off);ctx.stroke();}
        if(tr.t>tr.draw&&t%4<2){ctx.globalAlpha=0.35;ctx.fillStyle='#FFE45C';ctx.fillRect(0,tr.y-10,W,20);}}
      else{const q=(tr.t-tr.boom)/16;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-q)*0.9;ctx.fillStyle='#FFE45C';ctx.fillRect(0,tr.y-16-q*20,W,32+q*40);ctx.globalAlpha=(1-q);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,tr.y-5,W,10);}
    }
  }
  // 택견 협회장
  for(const n of npcs){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,n.t/6)*(n.t>48&&n.mode==='combo'?Math.max(0,1-(n.t-48)/8):1);drawMaster(n);}
  // 붐박스
  for(const b of boxes){
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=b.life<40?b.life/40:1;
    const bump=Math.abs(Math.sin(t*0.25))*4;
    ctx.fillStyle='#2A2F3A';ctx.fillRect(b.x-34,GROUND-38-bump,68,38);
    ctx.fillStyle='#4A5260';ctx.fillRect(b.x-30,GROUND-34-bump,60,30);
    for(const sx of [-16,16]){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(b.x+sx,GROUND-19-bump,11,0,Math.PI*2);ctx.fill();ctx.fillStyle=t%8<4?'#FF7ACB':'#8A4F7D';ctx.beginPath();ctx.arc(b.x+sx,GROUND-19-bump,11*(0.5+Math.abs(Math.sin(t*0.3))*0.4),0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#8A96A8';ctx.fillRect(b.x-6,GROUND-34-bump,12,8);
    ctx.strokeStyle='#8A96A8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,GROUND-38-bump,26,Math.PI,0);ctx.stroke();
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.3;ctx.fillStyle='#FF7ACB';ctx.beginPath();ctx.ellipse(b.x,GROUND-20,60,26,0,0,Math.PI*2);ctx.fill();
  }
  // 도선
  for(const w of wires){
    const o=fighters[w.owner];const ax=w.bx,ay=w.by-34,bx=o.x,by=o.y-60;
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=w.life<40?w.life/40:1;
    ctx.fillStyle='#2A2F3A';ctx.fillRect(ax-16,ay-6,32,40);ctx.fillStyle='#FFE45C';ctx.fillRect(ax-16,ay-6,32,10);ctx.fillStyle='#C9D6E3';ctx.fillRect(ax-6,ay-12,12,6);
    ctx.fillStyle='#FFE45C';ctx.font="12px 'Black Han Sans'";ctx.textAlign='center';ctx.fillText('+',ax,ay+18);
    ctx.globalCompositeOperation='lighter';
    const segs=14,dx=(bx-ax)/segs,dy=(by-ay)/segs;
    if(!w.jit||t%3===0){w.jit=[];for(let i=0;i<segs;i++)w.jit.push((Math.random()-0.5)*14);}
    for(const [lw,al,c] of [[7,0.3,'#FFB300'],[2.5,1,'#FFE45C']]){ctx.globalAlpha=al*(w.life<40?w.life/40:1);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(ax,ay);
      for(let i=1;i<segs;i++){ctx.lineTo(ax+dx*i,ay+dy*i+w.jit[i]);}ctx.lineTo(bx,by);ctx.stroke();}
    if(t%4===0)sparks(ax+dx*Math.floor(Math.random()*segs),ay+dy*Math.floor(Math.random()*segs),1,'#FFE45C',3);
  }
  for(const q of particles){ctx.globalAlpha=Math.min(1,q.life/16);if(q.dust){ctx.globalCompositeOperation='source-over';ctx.globalAlpha*=0.7;ctx.fillStyle=q.c;ctx.fillRect(q.x-2*q.z,q.y-2*q.z,4*q.z,4*q.z);ctx.globalCompositeOperation='lighter';continue;}if(q.flake){const r=q.sz;q.rot+=0.04;ctx.strokeStyle=q.c;ctx.lineWidth=1.6;ctx.beginPath();for(let k=0;k<3;k++){const an=q.rot+k*Math.PI/3;ctx.moveTo(q.x-Math.cos(an)*r,q.y-Math.sin(an)*r);ctx.lineTo(q.x+Math.cos(an)*r,q.y+Math.sin(an)*r);}ctx.stroke();continue;}if(q.line){ctx.strokeStyle=q.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*2.5,q.y-q.vy*2.5);ctx.stroke();}else{ctx.fillStyle=q.c;const s=3*q.z;ctx.fillRect(q.x-s,q.y-s,s*2,s*2);}}
  ctx.restore();ctx.globalAlpha=1;
}
function drawHUD(){
  const bw=480;
  for(const f of fighters){
    const left=f.i===0;const x=left?60:W-60-bw;const col=left?P1C:P2C;
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(x-4,36,bw+8,34);ctx.fillStyle='#2A2F3A';ctx.fillRect(x,40,bw,26);
    const r=f.hp/f.maxhp,w=bw*r;ctx.fillStyle=r>0.4?col:'#FFB03B';ctx.fillRect(left?x+bw-w:x,40,w,26);
    txt(f.c.name,left?x+6:x+bw-6,53,18,PAPER,left?'left':'right');
    for(let k=0;k<2;k++){ctx.fillStyle=match.wins[f.i]>k?GOLD:'#3B4252';ctx.beginPath();ctx.arc(left?x+16+k*28:x+bw-16-k*28,88,9,0,Math.PI*2);ctx.fill();}
    const slots=[{sk:f.c.basic,cd:f.cdb,key:left?'SPACE':'ENTER'},...f.c.skills.map((sk,s)=>({sk,cd:f.cds[s],key:left?['G','H','J'][s]:['4','5','6'][s]}))];
    slots.forEach((sl,s)=>{
      const sx=left?x+70+s*104:x+bw-70-(3-s)*104-96;const sy=100;
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(sx,sy,96,30);
      const ready=sl.cd===0&&!(sl.sk.type==='pierce'&&fighters[1-f.i].onGround);ctx.fillStyle=ready?f.c.color:'#556';ctx.fillRect(sx,sy,96*(1-sl.cd/sl.sk.cd),30);
      txt(`${sl.key} ${sl.sk.type==='physics'?'물리·'+PHYS[f.physIdx]:sl.sk.name}`,sx+48,sy+15,13,ready?'#111':PAPER,'center','Gowun Dodum');
    });
  }
  for(const f of fighters){const left=f.i===0;const x=left?60:W-60-480;const gx=left?x+70:x+480-70-90,gy=136;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(gx,gy,90,16);const br=f.gBreak>0;ctx.fillStyle=br?'#FF5E5E':'#7FD8FF';ctx.fillRect(gx,gy,90*(br?(1-f.gBreak/150):f.gHp/100),16);txt(br?'가드 불가':(left?'S 가드':'↓ 가드'),gx+45,gy+8,11,'#111','center','Gowun Dodum');}
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-50,28,100,52);txt(String(Math.ceil(timer/60)),W/2,55,36,GOLD);
}
function drawMenu(){
  drawStage();ctx.fillStyle='rgba(15,21,36,0.6)';ctx.fillRect(0,0,W,H);
  txt('울곽 파이터',W/2,190,110,GOLD);txt('울산과학고 2D 대전 격투',W/2,270,26,PAPER,'center','Gowun Dodum');
  ['플레이','조작법'].forEach((s,i)=>{const sel=i===menuIdx;ctx.fillStyle=sel?GOLD:'rgba(255,255,255,0.08)';ctx.fillRect(W/2-160,380+i*90,320,64);txt(s,W/2,412+i*90,36,sel?'#111':PAPER);});
  txt('W/S 또는 ↑/↓ 이동  ·  G / Space / 숫자패드4 / Enter 선택',W/2,600,18,'#8A96A8','center','Gowun Dodum');
}
function drawControls(){
  drawStage();ctx.fillStyle='rgba(15,21,36,0.75)';ctx.fillRect(0,0,W,H);txt('조작법',W/2,80,60,GOLD);
  const cols=[{n:'플레이어 1',c:P1C,x:340,r:[['이동','A / D'],['점프','W'],['가드','S 누르고 있기'],['평타','Space'],['스킬 1','G'],['스킬 2','H'],['스킬 3','J']]},
              {n:'플레이어 2',c:P2C,x:940,r:[['이동','← / →'],['점프','↑'],['가드','↓ 누르고 있기'],['평타','Enter'],['스킬 1','숫자패드 4'],['스킬 2','숫자패드 5'],['스킬 3','숫자패드 6']]}];
  for(const col of cols){ctx.fillStyle=col.c;ctx.fillRect(col.x-200,125,400,50);txt(col.n,col.x,150,28,'#111');
    col.r.forEach((row,i)=>{ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(col.x-200,182+i*52,400,46);txt(row[0],col.x-180,205+i*52,20,'#8A96A8','left','Gowun Dodum');txt(row[1],col.x+180,205+i*52,22,PAPER,'right');});}
  txt('가드 중 정면 피해 75% 감소 · 나비효과는 가드로 무효화 · 물리는 용수철→역학→전자기학 순환',W/2,570,17,'#8A96A8','center','Gowun Dodum');txt('가드는 체력제(막을수록 소모, 풀면 회복, 다 닳으면 잠시 사용 불가) · 좌/우 두 번 = 대쉬',W/2,598,15,'#8A96A8','center','Gowun Dodum');
  txt('아무 선택 키로 돌아가기',W/2,630,20,GOLD,'center','Gowun Dodum');
}
function drawSelect(){
  drawStage();ctx.fillStyle='rgba(15,21,36,0.75)';ctx.fillRect(0,0,W,H);
  txt(`ROUND ${match.round}`,W/2,70,44,GOLD);txt(`${match.wins[0]} : ${match.wins[1]}`,W/2,115,28,PAPER);
  const p=match.picker,pc=p===0?P1C:P2C;
  if(match.phase<2)txt(`플레이어${p+1} 캐릭터 선택`,W/2,170,32,pc);else txt('VS',W/2,170,60,GOLD);
  const cw=220,gap=40,x0=W/2-(cw*CHARS.length+gap*(CHARS.length-1))/2;
  CHARS.forEach((c,i)=>{
    const x=x0+i*(cw+gap),y=230;
    ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(x,y,cw,300);ctx.fillStyle=c.color;ctx.fillRect(x,y,cw,10);
    const mf={i:0,c,x:x+cw/2,y:y+215,face:1,onGround:true,vx:0,block:false,atk:null};
    ctx.save();ctx.translate(mf.x,mf.y);ctx.scale(1.15,1.15);ctx.translate(-mf.x,-mf.y);drawFighterBody(mf,mf.x,mf.y,c.color);ctx.restore();
    txt(c.name,x+cw/2,y+258,32,PAPER);txt(c.desc,x+cw/2,y+286,15,'#8A96A8','center','Gowun Dodum');txt(`HP ${c.hp}`,x+cw/2,y+32,16,PAPER,'center','Gowun Dodum');
    for(let k=0;k<2;k++){
      const show=(match.phase<2&&match.picker===k&&match.cursor[k]===i)||(match.pick[k]===i);if(!show)continue;
      ctx.strokeStyle=k===0?P1C:P2C;ctx.lineWidth=match.pick[k]===i?8:5;ctx.strokeRect(x-4-k*8,y-4-k*8,cw+8+k*16,300+8+k*16);
      if(match.pick[k]===i){ctx.fillStyle=k===0?P1C:P2C;ctx.fillRect(x+(k===0?0:cw-60),y-30,60,26);txt(`P${k+1}`,x+(k===0?30:cw-30),y-17,18,'#111');}
    }
  });
  if(match.phase<2){txt(p===0?'A/D 이동, G 또는 Space 선택':'←/→ 이동, 숫자패드4 또는 Enter 선택',W/2,600,22,'#8A96A8','center','Gowun Dodum');txt(`선택 순서: 플레이어${match.first+1} → 플레이어${2-match.first}`,W/2,640,18,'#8A96A8','center','Gowun Dodum');}
}
function drawFight(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawStage();for(const f of fighters)drawFighter(f);drawFx();drawProjs();
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*0.06})`;ctx.fillRect(0,0,W,H);}
  if(mirrorT>0){ctx.save();ctx.strokeStyle='#F2F2EA';ctx.globalAlpha=0.5+0.3*Math.sin(t*0.3);ctx.lineWidth=6;ctx.setLineDash([22,12]);ctx.strokeRect(10,10,W-20,H-20);ctx.setLineDash([]);ctx.restore();txt(`피해 반사 ${Math.ceil(mirrorT/60)}`,W/2,100,22,'#F2F2EA','center','Gowun Dodum');}
  drawTimeStop();
  drawHUD();
  if(scene==='fight'&&msgTimer>0){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,H/2-70,W,140);txt(msgTimer<40?'FIGHT!':roundMsg,W/2,H/2,msgTimer<40?90:72,GOLD);}
  if(scene==='roundEnd'){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,H/2-80,W,160);txt(roundMsg,W/2,H/2,80,GOLD);}
}
function drawMatchEnd(){
  drawStage();ctx.fillStyle='rgba(15,21,36,0.8)';ctx.fillRect(0,0,W,H);
  const w=match.wins[0]>=2?0:1;txt(`플레이어${w+1} 최종 승리`,W/2,280,84,w===0?P1C:P2C);txt(`${match.wins[0]} : ${match.wins[1]}`,W/2,380,48,PAPER);txt('아무 선택 키로 메인 화면',W/2,520,22,GOLD,'center','Gowun Dodum');
}
function draw(){
  if(scene==='menu')drawMenu();else if(scene==='controls')drawControls();else if(scene==='select')drawSelect();
  else if(scene==='fight'||scene==='roundEnd')drawFight();else if(scene==='matchEnd')drawMatchEnd();
}
const STEP=1000/60;let acc=0,last=0;
function loop(now){
  if(!last)last=now;
  acc+=Math.min(now-last,100);last=now;
  let ran=false;
  while(acc>=STEP){update();if(!holdInput)for(const k in pressed)pressed[k]=false;holdInput=false;acc-=STEP;ran=true;}
  if(ran)draw();
  requestAnimationFrame(loop);
}
document.fonts.ready.then(()=>requestAnimationFrame(loop));
</script>
