<!DOCTYPE html>

<head>

<style>

  html,body{height:100%}

  .tb.cd{opacity:.4}
  .k-atk{background:rgba(255,216,77,.25)}.k-dash{background:rgba(80,140,255,.3)}

  .pad.split{inset:auto;bottom:3vmin;width:58vmin;height:34vmin}
  #padL{left:calc(1vw + env(safe-area-inset-left,0px))}#padR{right:calc(1vw + env(safe-area-inset-right,0px))}
  .split .joy{left:0;bottom:0;width:23vmin;height:23vmin}
  #padL .joy{border-color:rgba(255,94,94,.7)}#padR .joy{border-color:rgba(90,160,255,.7)}
  .split .tag{position:absolute;left:0;bottom:24.5vmin;font-size:3vmin;pointer-events:none}
  #padL .tag{color:#FF7A7A}#padR .tag{color:#7FB8FF}

  #trainbar{position:absolute;top:2vmin;left:50%;transform:translateX(-50%);display:flex;gap:1.2vmin;pointer-events:none}

</style>

    <button class="tb" data-code="Digit5">난이도</button><button class="tb" data-code="Digit6">쿨 0</button><button class="tb" data-code="KeyR">리셋</button>
  </div>
  <div id="rotate">화면을 가로로 돌려주세요</div>
</div>
<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let rngS=(Date.now()>>>0)||1;
function rngSeed(v){rngS=(v>>>0)||1;}
function rng(){let z=(rngS=(rngS+0x6D2B79F5)>>>0);z=Math.imul(z^(z>>>15),z|1);z^=z+Math.imul(z^(z>>>7),z|61);return((z^(z>>>14))>>>0)/4294967296;}
const mkCv=(w,h)=>{try{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}catch(e){return null;}};
const W=1280,H=720,GROUND=600;
const P1C='#F0503C',P2C='#3F8CF2',GOLD='#FFD23F',PAPER='#F3EFE4';

/* ---------- 입력 ---------- */
const keys={},pressed={};
const P1K={up:'KeyW',left:'KeyA',down:'KeyS',right:'KeyD',atk:'Space',s1:'KeyG',s2:'KeyH',s3:'KeyJ'};
const P2K={up:'ArrowUp',left:'ArrowLeft',down:'ArrowDown',right:'ArrowRight',atk:'Enter',s1:'Numpad4',s2:'Numpad5',s3:'Numpad6'};
function onKeyDown(e){
  if(e.code==='Escape'&&!net.on&&!match.training&&['fight','select','roundEnd','matchEnd'].includes(scene)){for(const k in keys)keys[k]=false;scene='menu';return;}
  if(scene==='online'&&lobby.mode==='typing'){lobbyType(e);e.preventDefault();return;}
  if(net.on){if(e.code==='Escape'){netEnd('대전을 나갔습니다');return;}if(!raw[e.code])rawLatch[e.code]=true;raw[e.code]=true;if(e.code.startsWith('Arrow')||e.code.startsWith('Numpad')||e.code==='Space'||e.code==='Enter')e.preventDefault();return;}
  if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;
  if(e.code.startsWith('Arrow')||e.code.startsWith('Numpad')||e.code==='Space'||e.code==='Enter')e.preventDefault();
}
function onKeyUp(e){raw[e.code]=false;if(net.on)return;keys[e.code]=false;}
window.addEventListener('keydown',onKeyDown);window.addEventListener('keyup',onKeyUp);
const down=c=>!!keys[c],hit=c=>{const v=!!pressed[c];pressed[c]=false;return v;};

/* ---------- 캐릭터 정의 ----------
 type: melee | dash | rush | proj | spread | backshot | grenade | shotgun | rain | burst | beam
 fx  : 이펙트 종류 (slash, punch, arrow, bullet, blast, beam, boom)
*/
const CHARS=[
 {id:'hwang',name:'황시논',desc:'뺨, 얼음, 나비, 그리고 물리',color:'#7FD8FF',glow:'#2E8BFF',hp:110,
  basic:{name:'뺨때리기',cd:40,type:'melee',start:11,active:5,total:19,range:66,h:50,dmg:6,kb:6,fx:'slap'},
  skills:[
   {name:'시원',cd:330,type:'freeze',start:6,active:8,total:16,range:130,h:90,dmg:6,freeze:60,fx:'ice'},
   {name:'나비효과',cd:260,type:'butterfly',start:7,total:14,speed:5.5,dmg:8,kb:4,w:26,h:22,fx:'bfly'},
   {name:'물리',cd:300,type:'physics',start:7,total:15,fx:'phys'},
  ]},
 {id:'kim',name:'김찬희',desc:'표식, 냉방, 그리고 BGM',color:'#4FE3C1',glow:'#00C9A7',hp:100,
  basic:{name:'지건',cd:16,type:'poke',start:4,active:4,total:14,range:80,h:30,yoff:50,dmg:4,kb:3,fx:'poke'},
  skills:[
   {name:'16도 냉방',cd:330,type:'cold',start:12,total:26,dur:300,fx:'cold'},
   {name:'꿰뚫기',cd:250,type:'pierce',start:3,active:9,total:22,range:70,h:170,dmg:13,bleed:300,fx:'pierce'},
   {name:'BGM',cd:660,type:'bgm',start:10,total:26,dur:300,fx:'bgm'},
  ]},
 {id:'yoon',name:'윤설중',desc:'분필 하나로 수업한다',color:'#F2F2EA',glow:'#9FA8B8',hp:95,
  basic:{name:'샥/슥/촙',cd:22,type:'chalk',fx:'chalk'},
  skills:[
   {name:'치즈나쵸',cd:210,type:'nacho',start:6,total:16,dmg:11,fx:'nacho'},
   {name:'택견 협회장',cd:300,type:'master',start:8,total:18,fx:'master'},
   {name:'짐승새끼',cd:280,type:'beast',start:8,total:18,speed:15,dmg:4,fx:'beast'},
  ]},
 {id:'jjun',name:'쭌수',desc:'입으로 싸운다',color:'#FF5E5E',glow:'#FF1E1E',hp:105,
  basic:{name:'알파벳',cd:58,type:'letters',shots:[3,7,11],total:16,speed:11,dmg:3,kb:2,w:20,h:20,life:13,per:2,fx:'letter'},
  skills:[
   {name:'사이렌',cd:260,type:'siren',start:30,total:43,dmg:14,fear:60,fx:'siren'},
   {name:'댓츠 노노',cd:360,type:'counter',start:4,total:70,fx:'no'},
   {name:'OK!?',cd:540,type:'ok',start:8,total:118,fx:'ok'},
  ]},
 {id:'dimi',name:'디미나이',desc:'헤드뱅잉, 필기, 그리고 슬리퍼',color:'#C08CFF',glow:'#8A3FFF',hp:105,
  basic:{name:'헤드뱅잉',cd:12,type:'headbang',start:1,total:9999,every:12,dmg:2,kb:3,drain:0.67,regen:0.8,delay:12,faint:30,fx:'none'},
  skills:[
   {name:'필기본',cd:300,type:'notes',start:8,total:18,travel:30,r:80,dmg:2,root:90,fx:'none'},
   {name:'빡미나이',cd:600,type:'serious',start:18,total:30,dur:240,fx:'none'},
   {name:'밤티 슬리퍼',cd:420,type:'slipper',start:10,total:22,slam:36,half:88,dmg:6,stunT:120,fx:'none'},
  ]},
 {id:'yoonjun',name:'윤준쌋도루',desc:'주력, 아오, 아카, 그리고 영역',color:'#5B8CFF',glow:'#2A4BFF',hp:100,
  basic:{name:'주먹',cd:30,type:'jfist',start:6,active:5,total:18,range:78,h:50,dmg:6,kb:7,kby:-2,fx:'jpunch'},
  skills:[
   {name:'아오',cd:420,type:'ao',start:8,total:18,dist:90,life:150,pullR:240,pull:3.4,dotR:95,tick:20,dot:1.5,fx:'none'},
   {name:'아카',cd:360,type:'aka',start:8,total:18,speed:24,decel:0.955,boomR:100,dmg:7,knockT:34,fx:'none'},
   {name:'영역전개',cd:900,type:'domain',start:14,total:30,dur:240,selfStun:30,fx:'none'},
  ]},
];
const MURA={r:95,dmg:18,kb:16,speed:15,charge:18},AKA_WALL=8;
const JJ={bfDmg:8,bfCdr:120,bfMark:90,rctDur:480,rctMax:5,tpRange:640,tpCd:0,aoR:340,aoDot:130,akaSpd:30,akaDecel:0.965,akaBoomR:130,akaKnock:48,akaTime:62,akaMin:80,akaMax:530,akaMaxE:860};
const JCOMBO={name:'연타',type:'jcombo',hits:[6,14,22,32],dmgs:[3,3,3,5],total:44,range:100,h:64,dmg:3};
const PHYS=['용수철','역학','전자기학'];
const CHALK_V=[
 {name:'샥',start:6,active:5,total:18,range:70,h:115,yoff:10,dmg:6,kb:4},
 {name:'슥',start:6,active:5,total:18,range:100,h:44,yoff:40,dmg:6,kb:5},
 {name:'촙',start:5,active:6,total:20,range:88,h:30,yoff:55,dmg:7,kb:7,dash:9},
];
const CHALK_EMP={name:'강화 평타',type:'chalkemp',hits:[4,8,12,16,20],waveAt:30,total:46,range:92,h:90,dmg:4,fx:'chalkemp'};
const ARROWS=['up','right','down','left'];
const UPOKE={name:'어퍼지건',cd:0,type:'upoke',start:4,active:6,total:22,range:74,h:95,yoff:95,dmg:8,kb:5,fx:'upoke'};
/* 5x5 픽셀 폰트 */
const PIX={A:[14,17,31,17,17],B:[30,17,30,17,30],C:[15,16,16,16,15],D:[30,17,17,17,30],E:[31,16,30,16,31],F:[31,16,30,16,16],G:[15,16,19,17,15],H:[17,17,31,17,17],I:[31,4,4,4,31],J:[7,2,2,18,12],K:[17,18,28,18,17],L:[16,16,16,16,31],M:[17,27,21,17,17],N:[17,25,21,19,17],O:[14,17,17,17,14],P:[30,17,30,16,16],Q:[14,17,21,18,13],R:[30,17,30,18,17],S:[15,16,14,1,30],T:[31,4,4,4,4],U:[17,17,17,17,14],V:[17,17,17,10,4],W:[17,17,21,27,17],X:[17,10,4,10,17],Y:[17,10,4,4,4],Z:[31,2,4,8,31],'!':[4,4,4,0,4],'?':[14,17,2,0,4]};
const PIXC=new Map();
function drawPix(str,x,y,px,col,align='center'){
  const w=str.length*6*px-px;let sx=align==='center'?x-w/2:align==='right'?x-w:x;
  const key=str+'|'+px+'|'+col;let sp=PIXC.get(key);
  if(sp===undefined){sp=mkCv(w+1,5*px+1);if(sp){const g2=sp.getContext('2d');g2.fillStyle=col;let ox=0;for(const ch of str){const g=PIX[ch];if(g){for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(g[r]>>(4-c)&1)g2.fillRect(ox+c*px,r*px,px,px);}ox+=6*px;}}if(PIXC.size>400)PIXC.clear();PIXC.set(key,sp);}
  if(sp){ctx.drawImage(sp,sx,y-2.5*px);return;}
  ctx.fillStyle=col;
  for(const ch of str){const g=PIX[ch];if(g){for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(g[r]>>(4-c)&1)ctx.fillRect(sx+c*px,y-2.5*px+r*px,px,px);}sx+=6*px;}
}
/* ---------- 상태 ---------- */
let scene='menu',menuIdx=0,t=0,hitstop=0,flash=0,holdInput=false;
const match={round:1,wins:[0,0],first:0,pick:[null,null],picker:0,cursor:[0,0],phase:0,vsTimer:0};
let fighters=[],projs=[],particles=[],fx=[],ghosts=[],springs=[],wires=[],boxes=[],tris=[],npcs=[],dms=[],mirrorT=0,ts=null,timer=0,roundMsg='',msgTimer=0,shake=0;

const AIK={up:'AI_up',left:'AI_left',down:'AI_down',right:'AI_right',atk:'AI_atk',s1:'AI_s1',s2:'AI_s2',s3:'AI_s3'};
const DUMK={up:'DM_up',left:'DM_left',down:'DM_down',right:'DM_right',atk:'DM_atk',s1:'DM_s1',s2:'DM_s2',s3:'DM_s3'};
const tr={opp:0,lv:1,noCd:false,combo:0,hits:0,comboT:0,last:0,lastHits:0,lastHp:0,idle:0};
const AILV=[{n:'쉬움',iv:34,agg:0.2,grd:0.1,sk:0.1},{n:'보통',iv:16,agg:0.5,grd:0.35,sk:0.3},{n:'어려움',iv:6,agg:0.85,grd:0.65,sk:0.6}];
function newTraining(){match.training=true;match.round=1;match.wins=[0,0];match.first=0;startSelect();}
function trClear(){projs=[];springs=[];wires=[];boxes=[];tris=[];npcs=[];dms=[];ts=null;mirrorT=0;}
function trSpawn(kind){const p=fighters[0];const f=makeFighter(1,tr.opp);f.ctrl=kind;f.x=p.x<W/2?Math.min(W-60,p.x+320):Math.max(60,p.x-320);f.face=Math.sign(p.x-f.x)||-1;fighters[1]=f;trClear();for(const k in AIK)keys[AIK[k]]=false;tr.lastHp=f.hp;tr.combo=0;tr.hits=0;tr.comboT=0;tr.idle=0;
  addFx({k:'ring',x:f.x,y:f.y-50,col:f.c.color,life:18,r0:20,r1:110});addFx({k:'ptext',x:f.x,y:f.y-130,dir:1,text:kind==='ai'?'AI':'DUMMY',px:5,col:'#FFFFFF',glow:f.c.glow,life:30,rise:true});}
function trReset(){const kind=fighters[1].ctrl||'dummy';const c0=match.pick[0];fighters[0]=makeFighter(0,c0);trSpawn(kind);tr.last=0;tr.lastHits=0;}
function trInput(){
  if(hit('Escape')){scene='menu';match.training=false;return;}
  if(hit('Digit1'))trSpawn('dummy');
  if(hit('Digit2'))trSpawn('ai');
  const n=CHARS.length;
  if(hit('Digit3')){tr.opp=(tr.opp+n-1)%n;trSpawn(fighters[1].ctrl||'dummy');}
  if(hit('Digit4')){tr.opp=(tr.opp+1)%n;trSpawn(fighters[1].ctrl||'dummy');}
  if(hit('Digit5'))tr.lv=(tr.lv+1)%3;
  if(hit('Digit6'))tr.noCd=!tr.noCd;
  if(hit('KeyR'))trReset();
}
function trTick(){
  const [p,o]=fighters;
  for(const f of fighters){if(f.dead||f.hp<=0){f.hp=f.maxhp;f.dead=false;f.stun=0;addFx({k:'ring',x:f.x,y:f.y-50,col:'#FFFFFF',life:16,r0:20,r1:90});}}
  if(tr.noCd){p.cds=p.cds.map(()=>0);p.cdb=0;if(p.c.id==='dimi')p.hbG=100;}
  if(o.hp<tr.lastHp){tr.combo+=tr.lastHp-o.hp;tr.hits++;tr.comboT=90;tr.idle=0;}else tr.idle++;

function chalkDust(x,y,n){for(let i=0;i<n;i++)particles.push({x:x+(Math.random()-0.5)*30,y:y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:20+Math.random()*20,c:Math.random()<0.7?'#F2F2EA':'#FFE45C',z:0.5+Math.random()*0.5,dust:true});}
function streaks(x,y,n,col,pow=10,dir=0){n=Math.ceil(n*Math.max(0.25,1-particles.length/160));for(let i=0;i<n;i++){const a=(Math.random()-0.5)*1.6+(dir>0?0:Math.PI);const s=Math.random()*pow+4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:12+Math.random()*14,c:col,z:1,line:true});}}
function ribbonPts(e){
  // 원근이 들어간 타원 궤적 위의 점들
  if(e._pts)return e._pts;const N=26,pts=[];
  for(let i=0;i<=N;i++){const s=i/N,ang=e.a0+(e.a1-e.a0)*s;
    const px=Math.cos(ang)*e.rx,py=Math.sin(ang)*e.ry;
    const cr=Math.cos(e.rot),sr=Math.sin(e.rot);
    pts.push({x:px*cr-py*sr,y:px*sr+py*cr,s});}
  e._pts=pts;return pts;
}
function drawRibbon(e,p){
  const pts=ribbonPts(e);
  const head=Math.min(1,p*1.7),tail=Math.max(0,(p-0.3)/0.7);
  if(tail>=head)return;
  const inv=1-Math.max(0,(p-0.6)/0.4);
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.dir,1);
  const prof=s=>Math.pow(Math.sin(s*Math.PI),0.7);
  const outer=[],inner=[];
  for(let i=0;i<pts.length;i++){
    const q=pts[i];if(q.s<tail||q.s>head)continue;
    const nx=pts[Math.min(i+1,pts.length-1)],pv=pts[Math.max(i-1,0)];
    let tx=nx.x-pv.x,ty=nx.y-pv.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    const w=e.wmax*prof(q.s)*(1-Math.max(0,(q.s-head+0.15)/0.15));
    outer.push({x:q.x-ty*w,y:q.y+tx*w,s:q.s});inner.push({x:q.x+ty*w*0.35,y:q.y-tx*w*0.35,s:q.s});
  }
  if(outer.length<2){ctx.restore();return;}
  const path=()=>{ctx.beginPath();ctx.moveTo(outer[0].x,outer[0].y);for(const o of outer)ctx.lineTo(o.x,o.y);for(let i=inner.length-1;i>=0;i--)ctx.lineTo(inner[i].x,inner[i].y);ctx.closePath();};
  // 1) 넓은 글로우
  ctx.globalAlpha=0.3*inv;ctx.fillStyle=e.glow;path();ctx.fill();
  // 2) 본체
  ctx.globalAlpha=0.85*inv;ctx.fillStyle=e.col;path();ctx.fill();
  // 3) 바깥 가장자리 밝은 선
  ctx.globalAlpha=inv;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(outer[0].x,outer[0].y);for(const o of outer)ctx.lineTo(o.x,o.y);ctx.stroke();
  ctx.globalAlpha=0.6*inv;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(inner[0].x,inner[0].y);for(const o of inner)ctx.lineTo(o.x,o.y);ctx.stroke();
  // 4) 띠 안쪽 소용돌이 무늬
  ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.6;
  const n=6;
  for(let k=0;k<n;k++){
    const s=(k+0.5)/n+((e.seed*(k+1))%7)/70;if(s<tail||s>head-0.05)continue;
    const idx=Math.round(s*(pts.length-1));const q=pts[idx];
    const nx=pts[Math.min(idx+1,pts.length-1)],pv=pts[Math.max(idx-1,0)];let tx=nx.x-pv.x,ty=nx.y-pv.y;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    const w=e.wmax*prof(s);const cx=q.x-ty*w*0.35,cy=q.y+tx*w*0.35;const r=Math.max(2,w*0.42);
    const dir=k%2?1:-1;ctx.globalAlpha=0.75*inv;ctx.beginPath();
    for(let j=0;j<=9;j++){const th=j/9*Math.PI*1.7*dir+p*2;const rr=r*(1-j/11);ctx.lineTo(cx+Math.cos(th)*rr,cy+Math.sin(th)*rr);}
    ctx.stroke();
    // 작은 방울
    ctx.globalAlpha=0.5*inv;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(q.x-ty*w*0.9,q.y+tx*w*0.9,1.6,0,Math.PI*2);ctx.fill();
  }
  // 5) 머리끝 번쩍임
  if(head<1){const q=pts[Math.round(head*(pts.length-1))];ctx.globalAlpha=0.5*inv;ctx.fillStyle=e.glow;ctx.beginPath();ctx.arc(q.x,q.y,e.wmax*1.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=inv;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(q.x,q.y,e.wmax*0.6,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

  if(!last)last=now;

  if(net.on){let n=0;while(acc>=STEP&&n<8){if(!netStep()){net.stall++;break;}net.stall=0;acc-=STEP;n++;}if(acc>STEP*6)acc=STEP*6;
    if(net.on&&now-net.lastPing>1000){net.lastPing=now;netSend({t:'p',ts:now});}
    draw();requestAnimationFrame(loop);return;}
  let ran=false;
  while(acc>=STEP){update();if(!holdInput)for(const k in pressed)pressed[k]=false;holdInput=false;acc-=STEP;ran=true;}
  if(ran)draw();
  requestAnimationFrame(loop);
}
document.fonts.ready.then(()=>requestAnimationFrame(loop));
</script>
